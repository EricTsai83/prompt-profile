<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Share-first profile directions</title>
    <style>
      *{box-sizing:border-box}body{margin:0;color:var(--foreground,#14204c);font:14px/1.5 system-ui,sans-serif}header{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}.directions,.views{display:flex;flex-wrap:wrap;gap:6px}button{font:inherit;font-size:12px;padding:8px 12px;border:1px solid var(--border,#dce2f1);border-radius:7px;background:var(--card,#fff);color:inherit;cursor:pointer}button[aria-pressed="true"]{background:var(--foreground,#14204c);color:var(--background,#fff);border-color:var(--foreground,#14204c)}button:focus-visible{outline:3px solid var(--ring,#3155f5);outline-offset:3px}.views button{font-size:11px;padding:7px 10px}figure{margin:0}img{display:block;width:100%;height:auto;border-radius:12px}.mobile img{max-width:390px;margin:auto}figcaption{font-size:12px;color:var(--muted-foreground,#657090);margin:10px 0 0}[hidden]{display:none!important}@media(max-width:580px){header{display:block}.views{margin-top:10px}.directions button{flex:1}img{border-radius:8px}}
    </style>
  </head>
  <body>
    <header>
      <div class="directions" role="group" aria-label="Design direction">
        <button type="button" data-direction="signal" aria-pressed="true">Signal</button
        ><button type="button" data-direction="afterhours" aria-pressed="false">Afterhours</button
        ><button type="button" data-direction="studio" aria-pressed="false">Studio</button>
      </div>
      <div class="views" role="group" aria-label="Captured view">
        <button type="button" data-view="card" aria-pressed="true">Share card</button
        ><button type="button" data-view="report" aria-pressed="false">Desktop</button
        ><button type="button" data-view="mobile" aria-pressed="false">Mobile</button>
      </div>
    </header>
    <figure data-panel="signal-card">
      <img
        src="startup-screenshots/signal-card.png"
        alt="Signal: 1200 × 630 share-card concept, using a fictional profile"
      />
      <figcaption>
        Signal · 1200 × 630 share-card concept. Fictional data. Research prototype, not shipped.
      </figcaption>
    </figure>
    <figure data-panel="signal-report" hidden>
      <img
        src="startup-screenshots/signal-report.png"
        alt="Signal: 1440px desktop report prototype, using a fictional profile"
      />
      <figcaption>
        Signal · 1440px desktop report prototype. Fictional data. Research prototype, not shipped.
      </figcaption>
    </figure>
    <figure data-panel="signal-mobile" class="mobile" hidden>
      <img
        src="startup-screenshots/signal-mobile.png"
        alt="Signal: 390px mobile report prototype, using a fictional profile"
      />
      <figcaption>
        Signal · 390px mobile report prototype. Fictional data. Research prototype, not shipped.
      </figcaption>
    </figure>
    <figure data-panel="afterhours-card" hidden>
      <img
        src="startup-screenshots/afterhours-card.png"
        alt="Afterhours: 1200 × 630 share-card concept, using a fictional profile"
      />
      <figcaption>
        Afterhours · 1200 × 630 share-card concept. Fictional data. Research prototype, not shipped.
      </figcaption>
    </figure>
    <figure data-panel="afterhours-report" hidden>
      <img
        src="startup-screenshots/afterhours-report.png"
        alt="Afterhours: 1440px desktop report prototype, using a fictional profile"
      />
      <figcaption>
        Afterhours · 1440px desktop report prototype. Fictional data. Research prototype, not
        shipped.
      </figcaption>
    </figure>
    <figure data-panel="afterhours-mobile" class="mobile" hidden>
      <img
        src="startup-screenshots/afterhours-mobile.png"
        alt="Afterhours: 390px mobile report prototype, using a fictional profile"
      />
      <figcaption>
        Afterhours · 390px mobile report prototype. Fictional data. Research prototype, not shipped.
      </figcaption>
    </figure>
    <figure data-panel="studio-card" hidden>
      <img
        src="startup-screenshots/studio-card.png"
        alt="Studio: 1200 × 630 share-card concept, using a fictional profile"
      />
      <figcaption>
        Studio · 1200 × 630 share-card concept. Fictional data. Research prototype, not shipped.
      </figcaption>
    </figure>
    <figure data-panel="studio-report" hidden>
      <img
        src="startup-screenshots/studio-report.png"
        alt="Studio: 1440px desktop report prototype, using a fictional profile"
      />
      <figcaption>
        Studio · 1440px desktop report prototype. Fictional data. Research prototype, not shipped.
      </figcaption>
    </figure>
    <figure data-panel="studio-mobile" class="mobile" hidden>
      <img
        src="startup-screenshots/studio-mobile.png"
        alt="Studio: 390px mobile report prototype, using a fictional profile"
      />
      <figcaption>
        Studio · 390px mobile report prototype. Fictional data. Research prototype, not shipped.
      </figcaption>
    </figure>
    <script>
      let direction="signal",view="card";
      function select(){for(const el of document.querySelectorAll("[data-direction]"))el.setAttribute("aria-pressed",String(el.dataset.direction===direction));for(const el of document.querySelectorAll("[data-view]"))el.setAttribute("aria-pressed",String(el.dataset.view===view));for(const panel of document.querySelectorAll("[data-panel]"))panel.hidden=panel.dataset.panel!==direction+"-"+view;}
      for(const button of document.querySelectorAll("[data-direction]"))button.addEventListener("click",()=>{direction=button.dataset.direction;select()});
      for(const button of document.querySelectorAll("[data-view]"))button.addEventListener("click",()=>{view=button.dataset.view;select()});
      console.assert(document.querySelectorAll("figure:not([hidden])").length===1,"Expected one visible capture");
    </script>
  </body>
</html>
