blockExoticSubdeps: true

catalog:
  "@effect/platform-node": 4.0.6
  "@effect/vitest": 4.0.6
  "@types/node": ^24.19.2
  effect: 4.0.6
  oxfmt: ^0.74.0
  oxlint: ^1.89.0
  tsdown: ^0.23.1
  tsx: ^4.23.15
  typescript: ^7.0.2
  vitest: ^5.0.5
catalogMode: strict
minimumReleaseAge: 2880

# effect@4.0.6 was published < 2 days before project setup; exempt only these exact pinned versions.
minimumReleaseAgeExclude:
  - effect@4.0.6
  - "@effect/platform-node@4.0.6"
  - "@effect/platform-node-shared@4.0.6"
  - "@effect/vitest@4.0.6"
strictDepBuilds: true
trustPolicy: no-downgrade

# esbuild (via tsx / tsdown) ships its binary through optionalDependencies; its postinstall
# is only a sanity check, so we explicitly deny it. New entries need a justification in the PR.
allowBuilds:
  esbuild: false
